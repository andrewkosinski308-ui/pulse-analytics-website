<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update Password | Pulse Analytics Admin / Staff Portal</title>
<meta name="description" content="Set a new password for your Pulse Analytics administrator account.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assetts/images/Pulse%20Analytics%20Favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/account-onboarding.css?v=20260927b">
<link rel="stylesheet" href="/css/auth-shell.css?v=20260927f">
</head>
<body class="enter-forward">
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TKX3TLC3" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<div class="onboard-scene" aria-hidden="true">
  <div class="onboard-gradient"></div>
  <div class="onboard-grid"></div>
  <div class="onboard-orb onboard-orb-a"></div>
  <div class="onboard-orb onboard-orb-b"></div>
  <div class="onboard-orb onboard-orb-c"></div>
  <canvas id="onboard-field"></canvas>
</div>
<div class="onboard-app">
  <header class="onboard-top">
    <a class="onboard-brand" href="/index.html">
      <img src="/assetts/images/transparent-logo-PA.jpeg" alt="">
      <span><strong>Pulse Analytics Group LLC</strong><span>Admin / Staff Portal</span></span>
    </a>
    <a class="onboard-top-link" href="/admin-login.html">Sign in</a>
  </header>
  <div class="onboard-layout auth-layout">
    <aside class="onboard-progress">
      <p class="onboard-kicker">Admin / Staff Portal</p>
      <h1>Set a new password.</h1>
      <p class="auth-support">Choose a strong password for your Pulse Analytics staff account.</p>
      <p class="auth-security">Pulse Analytics administrators and staff</p>
    </aside>
    <main class="onboard-panel">
      <h2>Set new password</h2>
      <div id="auth-alert" class="onboard-alert" role="alert" aria-live="polite"></div>
      <p id="recovery-status" class="auth-status" role="status">Checking recovery session…</p>
      <form id="update-form" class="onboard-form" hidden novalidate>
        <label class="password-row">New password
          <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8">
          <button type="button" class="password-toggle" id="toggle-password" aria-controls="password" aria-pressed="false" aria-label="Show password">Show</button>
        </label>
        <label class="password-row">Confirm password
          <input id="confirm" name="confirm" type="password" autocomplete="new-password" required minlength="8">
          <button type="button" class="password-toggle" id="toggle-confirm" aria-controls="confirm" aria-pressed="false" aria-label="Show password confirmation">Show</button>
        </label>
        <div class="onboard-actions">
          <button type="submit" class="onboard-continue" id="update-btn">Update Password</button>
        </div>
      </form>
      <p class="onboard-links"><a href="/admin-login.html">Back to sign in</a></p>
    </main>
  </div>
</div>
<script src="/js/supabase-env.js"></script>
<script type="module">
  import { startAuthScene, bindPasswordToggle } from './js/auth-scene.js';
  import {
    initAuth,
    subscribeAuth,
    updatePassword,
    getSupabase,
    getAuthState,
    isAdminPortalEligible,
    isAdminStaffPortalEligible,
    isClientPortalEligible
  } from './js/pulse-auth.js';

  startAuthScene();
  bindPasswordToggle(document.getElementById('password'), document.getElementById('toggle-password'), 'password');
  bindPasswordToggle(document.getElementById('confirm'), document.getElementById('toggle-confirm'), 'password confirmation');

  const alertEl = document.getElementById('auth-alert');
  const statusEl = document.getElementById('recovery-status');
  const form = document.getElementById('update-form');
  const button = document.getElementById('update-btn');
  let recoveryReady = false;

  function showAlert(message, type = 'error') {
    alertEl.textContent = message;
    alertEl.dataset.type = type;
    alertEl.classList.add('is-visible');
  }

  function enableForm() {
    recoveryReady = true;
    statusEl.hidden = true;
    form.hidden = false;
  }

  function blockForm(message) {
    recoveryReady = false;
    statusEl.hidden = false;
    statusEl.textContent = message;
    form.hidden = true;
  }

  try {
    await initAuth();
    const { data } = await getSupabase().auth.getSession();

    subscribeAuth((authState) => {
      if (authState.authEvent === 'PASSWORD_RECOVERY' || authState.session) {
        enableForm();
      }
    });

    if (data.session) {
      enableForm();
    } else {
      setTimeout(async () => {
        const again = await getSupabase().auth.getSession();
        if (again.data.session) {
          enableForm();
        } else {
          blockForm('This password reset link is invalid or has expired. Request a new link from the Forgot Password page.');
          showAlert('Recovery session not found.', 'error');
        }
      }, 800);
    }
  } catch (err) {
    blockForm(err.message || 'Unable to initialize authentication.');
    showAlert(err.message || 'Unable to initialize authentication.', 'error');
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (!recoveryReady) return;

    const password = form.password.value;
    const confirm = form.confirm.value;

    if (password.length < 8) {
      showAlert('Password must be at least 8 characters.', 'error');
      return;
    }
    if (password !== confirm) {
      showAlert('Passwords do not match.', 'error');
      return;
    }

    button.disabled = true;
    button.textContent = 'Updating…';

    try {
      await updatePassword(password);
      form.reset();
      const authState = getAuthState();
      if (isAdminPortalEligible(authState)) {
        showAlert('Password updated successfully. Redirecting to the Admin Portal…', 'success');
        setTimeout(() => window.location.replace('admin-portal.html'), 1200);
        return;
      }
      if (isAdminStaffPortalEligible(authState)) {
        showAlert('Password updated successfully. Redirecting to the Staff Portal…', 'success');
        setTimeout(() => window.location.replace('staff-workspace.html'), 1200);
        return;
      }
      if (authState.profile?.role === 'client') {
        showAlert('Password updated. This account uses the Client Portal.', 'success');
        const next = isClientPortalEligible(authState) ? 'client-portal.html' : 'client-login.html';
        setTimeout(() => window.location.replace(next), 1200);
        return;
      }
      showAlert('Password updated. This account is not an administrator.', 'success');
      setTimeout(() => window.location.replace('admin-unauthorized.html'), 1200);
    } catch (err) {
      showAlert(err.message || 'Unable to update password.', 'error');
      button.disabled = false;
      button.textContent = 'Update Password';
    }
  });
</script>
</body>
</html>
