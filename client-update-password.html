<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password | Pulse Analytics Client Portal</title>
    <meta name="description" content="Set a new password for your Pulse Analytics Client Portal account.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="assetts/images/Pulse%20Analytics%20Favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="client-portal.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-brand">
                <div class="header-logo">
                    <a href="index.html" class="logo">
                        <img src="assetts/images/transparent-logo-PA.jpeg" alt="Pulse Analytics Group LLC Logo">
                    </a>
                </div>
                <div class="header-branding">
                    <h1>Pulse Analytics Group LLC</h1>
                    <p>Client Portal</p>
                </div>
            </div>
            <div class="header-nav">
                <nav aria-label="Client auth navigation">
                    <ul class="nav-links">
                        <li><a href="client-login.html">Sign In</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main class="client-auth-page">
        <div class="container">
            <div class="client-auth-card">
                <div class="client-auth-brand">
                    <img src="assetts/images/transparent-logo-PA.jpeg" alt="">
                    <h1>Set New Password</h1>
                    <p>Choose a strong password for your client account</p>
                </div>

                <div id="auth-alert" class="client-auth-alert" role="alert" aria-live="polite"></div>
                <div id="recovery-status" class="client-portal-loading">Checking recovery session…</div>

                <form id="update-form" class="client-auth-form" hidden novalidate>
                    <label>
                        New password
                        <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters">
                    </label>
                    <label>
                        Confirm password
                        <input id="confirm" name="confirm" type="password" autocomplete="new-password" required minlength="8" placeholder="Re-enter password">
                    </label>
                    <div class="client-auth-actions">
                        <button type="submit" class="primary-button" id="update-btn">Update Password</button>
                    </div>
                </form>

                <div class="client-auth-links">
                    <a href="client-login.html">Back to Sign In</a>
                </div>
            </div>
        </div>
    </main>

    <script src="js/supabase-env.js"></script>
    <script type="module">
        import { initAuth, subscribeAuth, updatePassword, getSupabase } from './js/pulse-auth.js';

        const alertEl = document.getElementById('auth-alert');
        const statusEl = document.getElementById('recovery-status');
        const form = document.getElementById('update-form');
        const button = document.getElementById('update-btn');
        let recoveryReady = false;

        function showAlert(message, type = 'error') {
            alertEl.textContent = message;
            alertEl.dataset.type = type;
            alertEl.classList.add('is-visible');
        }

        function enableForm() {
            recoveryReady = true;
            statusEl.hidden = true;
            form.hidden = false;
        }

        function blockForm(message) {
            recoveryReady = false;
            statusEl.hidden = false;
            statusEl.textContent = message;
            form.hidden = true;
        }

        try {
            await initAuth();
            const { data } = await getSupabase().auth.getSession();

            subscribeAuth((authState) => {
                if (authState.authEvent === 'PASSWORD_RECOVERY' || authState.session) {
                    enableForm();
                }
            });

            if (data.session) {
                enableForm();
            } else {
                // Give hash/query token exchange a moment (detectSessionInUrl).
                setTimeout(async () => {
                    const again = await getSupabase().auth.getSession();
                    if (again.data.session) {
                        enableForm();
                    } else {
                        blockForm('This password reset link is invalid or has expired. Request a new link from the Forgot Password page.');
                        showAlert('Recovery session not found.', 'error');
                    }
                }, 800);
            }
        } catch (err) {
            blockForm(err.message || 'Unable to initialize authentication.');
            showAlert(err.message || 'Unable to initialize authentication.', 'error');
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            if (!recoveryReady) return;

            const password = form.password.value;
            const confirm = form.confirm.value;

            if (password.length < 8) {
                showAlert('Password must be at least 8 characters.', 'error');
                return;
            }
            if (password !== confirm) {
                showAlert('Passwords do not match.', 'error');
                return;
            }

            button.disabled = true;
            button.textContent = 'Updating…';

            try {
                await updatePassword(password);
                showAlert('Password updated successfully. Redirecting to sign in…', 'success');
                form.reset();
                setTimeout(() => {
                    window.location.replace('client-login.html');
                }, 1200);
            } catch (err) {
                showAlert(err.message || 'Unable to update password.', 'error');
            } finally {
                button.disabled = false;
                button.textContent = 'Update Password';
            }
        });
    </script>
</body>
</html>
