<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Denied | Pulse Analytics Admin Portal</title>
<meta name="description" content="This account is not authorized for the Pulse Analytics Admin Portal.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assetts/images/Pulse%20Analytics%20Favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/account-onboarding.css?v=20260927b">
<link rel="stylesheet" href="/css/auth-shell.css?v=20260927f">
</head>
<body class="enter-forward">
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TKX3TLC3" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<div class="onboard-scene" aria-hidden="true">
  <div class="onboard-gradient"></div>
  <div class="onboard-grid"></div>
  <div class="onboard-orb onboard-orb-a"></div>
  <div class="onboard-orb onboard-orb-b"></div>
  <div class="onboard-orb onboard-orb-c"></div>
  <canvas id="onboard-field"></canvas>
</div>
<div class="onboard-app">
  <header class="onboard-top">
    <a class="onboard-brand" href="/index.html">
      <img src="/assetts/images/transparent-logo-PA.jpeg" alt="">
      <span><strong>Pulse Analytics Group LLC</strong><span>Admin Portal</span></span>
    </a>
    <a class="onboard-top-link" href="/index.html">Back to website</a>
  </header>
  <div class="onboard-layout auth-layout">
    <aside class="onboard-progress">
      <p class="onboard-kicker">Admin Portal</p>
      <h1>Access denied</h1>
      <p class="auth-security">Authorized Pulse Analytics administrators only</p>
    </aside>
    <main class="onboard-panel">
      <h2>This portal is restricted</h2>
      <p class="onboard-lead" id="denied-lead">Checking your account…</p>
      <div id="auth-alert" class="onboard-alert" role="alert" aria-live="polite"></div>
      <p id="denied-account" class="auth-note" hidden></p>
      <div class="auth-actions" id="denied-actions" hidden>
        <a class="onboard-portal" id="client-portal-link" href="client-portal.html" hidden>Continue to Client Portal</a>
        <button type="button" class="onboard-back" id="sign-out-btn">Sign out</button>
        <a class="onboard-back" href="/index.html">Return to website</a>
      </div>
    </main>
  </div>
</div>
<script src="/js/supabase-env.js"></script>
<script type="module">
  import { startAuthScene } from './js/auth-scene.js';
  import {
    initAuth,
    enforceAdminPersistPreference,
    getAuthState,
    isAdminPortalEligible,
    isAdminStaffPortalEligible,
    isClientPortalEligible,
    signOut
  } from './js/pulse-auth.js';

  startAuthScene();

  const lead = document.getElementById('denied-lead');
  const alertEl = document.getElementById('auth-alert');
  const accountEl = document.getElementById('denied-account');
  const actions = document.getElementById('denied-actions');
  const clientLink = document.getElementById('client-portal-link');
  const signOutBtn = document.getElementById('sign-out-btn');

  function showAlert(message, type = 'error') {
    alertEl.textContent = message;
    alertEl.dataset.type = type;
    alertEl.classList.add('is-visible');
  }

  try {
    await initAuth();
    const ended = await enforceAdminPersistPreference();
    const authState = getAuthState();

    if (ended || !authState.authenticated) {
      window.location.replace('admin-login.html');
    } else if (isAdminPortalEligible(authState)) {
      window.location.replace('admin-portal.html');
    } else if (isAdminStaffPortalEligible(authState)) {
      window.location.replace('staff-workspace.html');
    } else {
      const email = authState.profile?.email || authState.user?.email || '';
      lead.textContent = 'You are signed in, but this account does not have administrator access.';
      if (email) {
        accountEl.hidden = false;
        accountEl.textContent = email;
      }
      if (authState.error) showAlert(authState.error, 'error');
      if (authState.profile?.role === 'client') {
        clientLink.hidden = false;
        clientLink.href = isClientPortalEligible(authState)
          ? 'client-portal.html'
          : 'client-login.html';
      }
      actions.hidden = false;
    }
  } catch (err) {
    lead.textContent = 'Administrator access could not be verified.';
    showAlert(err.message || 'Unable to initialize authentication.', 'error');
  }

  signOutBtn.addEventListener('click', async () => {
    signOutBtn.disabled = true;
    signOutBtn.textContent = 'Signing out…';
    try {
      await signOut();
      window.location.replace('admin-login.html');
    } catch (err) {
      signOutBtn.disabled = false;
      signOutBtn.textContent = 'Sign out';
      showAlert(err.message || 'Sign-out failed.', 'error');
    }
  });
</script>
</body>
</html>
