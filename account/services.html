<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Services of interest | Pulse Analytics</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assetts/images/Pulse%20Analytics%20Favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/account-onboarding.css?v=20260927b">
</head>
<body data-onboarding-step="4">
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TKX3TLC3" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<div class="onboard-scene" aria-hidden="true">
  <div class="onboard-gradient"></div>
  <div class="onboard-grid"></div>
  <div class="onboard-orb onboard-orb-a"></div>
  <div class="onboard-orb onboard-orb-b"></div>
  <div class="onboard-orb onboard-orb-c"></div>
  <canvas id="onboard-field"></canvas>
</div>
<div class="onboard-app">
  <header class="onboard-top">
    <a class="onboard-brand" href="/index.html">
      <img src="/assetts/images/transparent-logo-PA.jpeg" alt="">
      <span><strong>Pulse Analytics</strong><span>Client account</span></span>
    </a>
    <button type="button" class="onboard-signout" id="onboard-signout" hidden>Sign out</button>
  </header>
  <div class="onboard-layout">
    <aside class="onboard-progress">
      <p class="onboard-kicker">Step 04</p>
      <h1>What should we focus on first?</h1>
      <ol class="onboard-steps">
        <li class="is-done"><a href="/account/create"><span class="onboard-index">01</span>Account</a></li>
        <li class="is-done"><a href="/account/business"><span class="onboard-index">02</span>Business</a></li>
        <li class="is-done"><a href="/account/discovery"><span class="onboard-index">03</span>Discovery</a></li>
        <li><span aria-current="step"><span class="onboard-index">04</span>Services</span></li>
      </ol>
    </aside>
    <main class="onboard-panel">
      <p id="onboard-status" role="status">Checking your account…</p>
      <div id="onboard-alert" class="onboard-alert" role="alert"></div>
      <div id="onboard-body" hidden>
        <h2>Services of interest</h2>
        <p class="onboard-lead">Select every service you want to explore. Then mark one as the primary focus.</p>
        <form class="onboard-form" data-onboarding-form novalidate>
          <div id="service-list" class="service-grid" role="group" aria-label="Services of interest"></div>
          <p class="onboard-error" data-error-for="interests" hidden></p>
          <p class="onboard-error" data-error-for="primary_interest" hidden></p>
          <div id="interest-note-wrap" hidden>
            <label>Describe the other service
              <input name="interest_note" maxlength="160">
            </label>
            <p class="onboard-error" data-error-for="interest_note" hidden></p>
          </div>
          <div class="onboard-actions">
            <button class="onboard-back" type="button" data-back="/account/discovery">Back</button>
            <button class="onboard-continue" type="submit">Continue</button>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>
<script src="/js/supabase-env.js"></script>
<script type="module" src="/js/account-onboarding.js?v=20260927e"></script>
</body>
</html>
