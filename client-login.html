<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
})(window,document,'script','dataLayer','GTM-TKX3TLC3');</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Portal Sign In | Pulse Analytics Group LLC</title>
<meta name="description" content="Sign in to the Pulse Analytics Client Portal.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assetts/images/Pulse%20Analytics%20Favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/account-onboarding.css?v=20260927b">
<link rel="stylesheet" href="/css/auth-shell.css?v=20260927f">
</head>
<body class="enter-forward">
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TKX3TLC3" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<div class="onboard-scene" aria-hidden="true">
  <div class="onboard-gradient"></div>
  <div class="onboard-grid"></div>
  <div class="onboard-orb onboard-orb-a"></div>
  <div class="onboard-orb onboard-orb-b"></div>
  <div class="onboard-orb onboard-orb-c"></div>
  <canvas id="onboard-field"></canvas>
</div>
<div class="onboard-app">
  <header class="onboard-top">
    <a class="onboard-brand" href="/index.html">
      <img src="/assetts/images/transparent-logo-PA.jpeg" alt="">
      <span><strong>Pulse Analytics</strong><span>Client Portal</span></span>
    </a>
    <a class="onboard-top-link" href="/index.html">Back to website</a>
  </header>
  <div class="onboard-layout auth-layout">
    <aside class="onboard-progress">
      <p class="onboard-kicker">Client Portal</p>
      <h1>Welcome back.</h1>
      <p class="auth-support">Sign in to your Pulse Analytics client account.</p>
    </aside>
    <main class="onboard-panel">
      <h2>Sign in</h2>
      <p class="onboard-lead">Use the email and password for your client account.</p>
      <div id="auth-alert" class="onboard-alert" role="alert" aria-live="polite"></div>
      <form id="client-login-form" class="onboard-form" novalidate>
        <label>Email
          <input id="email" name="email" type="email" autocomplete="username" required>
        </label>
        <label class="password-row">Password
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="button" class="password-toggle" id="toggle-password" aria-controls="password" aria-pressed="false" aria-label="Show password">Show</button>
        </label>
        <div class="onboard-actions">
          <button type="submit" class="onboard-continue" id="sign-in-btn">Sign In</button>
        </div>
      </form>
      <p class="onboard-links auth-links">
        <a href="/client-forgot-password.html">Forgot password?</a>
        Don't have an account? <a href="/account/create">Create one</a>
      </p>
    </main>
  </div>
</div>
<script src="/js/supabase-env.js"></script>
<script type="module">
  import { startAuthScene, bindPasswordToggle } from './js/auth-scene.js';
  import {
    initAuth,
    signIn,
    redirectAuthenticatedClientAwayFromLogin,
    clientEntryPath
  } from './js/pulse-auth.js';

  startAuthScene();
  bindPasswordToggle(document.getElementById('password'), document.getElementById('toggle-password'));

  const alertEl = document.getElementById('auth-alert');
  const form = document.getElementById('client-login-form');
  const button = document.getElementById('sign-in-btn');

  function showAlert(message, type = 'error') {
    alertEl.textContent = message;
    alertEl.dataset.type = type;
    alertEl.classList.add('is-visible');
  }

  function clearAlert() {
    alertEl.textContent = '';
    alertEl.classList.remove('is-visible');
  }

  try {
    await initAuth();
    const redirected = await redirectAuthenticatedClientAwayFromLogin();
    if (!redirected) {
      /* navigated away */
    }
  } catch (err) {
    showAlert(err.message || 'Unable to initialize authentication.', 'error');
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    clearAlert();

    const email = form.email.value.trim();
    const password = form.password.value;

    if (!email || !password) {
      showAlert('Enter your email and password.', 'error');
      return;
    }

    button.disabled = true;
    button.textContent = 'Signing in…';
    let leaving = false;

    try {
      const authState = await signIn(email, password);
      const destination = clientEntryPath(authState);
      if (destination) {
        leaving = true;
        window.location.replace(destination);
        return;
      }
      showAlert('Sign-in succeeded, but this account cannot access the Client Portal.', 'error');
    } catch (err) {
      showAlert(err.message || 'Sign-in failed. Check your credentials and try again.', 'error');
    } finally {
      if (!leaving) {
        button.disabled = false;
        button.textContent = 'Sign In';
      }
    }
  });
</script>
</body>
</html>
