    <header>
        <div class="container">
            <div class="header-brand">
                <div class="header-logo">
                    <a href="index.html" class="logo">
                        <img src="assetts/images/transparent-logo-PA.jpeg" alt="Pulse Analytics Group LLC Logo">
                    </a>
                </div>
                <div class="header-branding">
                    <h1>Pulse Analytics Group LLC</h1>
                    <p>Client Portal</p>
                </div>
            </div>
            <button type="button" class="portal-menu" id="portal-menu" aria-expanded="false" aria-controls="portal-nav" aria-label="Open navigation">
                <span class="portal-menu-icon" aria-hidden="true"></span>
                Menu
            </button>
        </div>
    </header>

    <main class="client-portal-shell">
        <div class="container">
            <div id="portal-loading" class="client-portal-loading">Verifying your session…</div>
            <div id="portal-app" class="portal-layout" hidden>
                <div class="portal-identity">
                    <p id="portal-who" class="portal-who"></p>
                </div>
                <nav class="portal-nav" id="portal-nav" aria-label="Client portal">
                    <button type="button" data-view="dashboard">Dashboard</button>
                    <button type="button" data-view="projects">Projects</button>
                    <button type="button" data-view="files">Files</button>
                    <button type="button" data-view="reports">Reports</button>
                    <button type="button" data-view="billing">Billing</button>
                    <button type="button" data-view="support">Support</button>
                    <button type="button" data-view="notifications">Notifications <span id="unread-count" class="portal-badge" hidden></span></button>
                    <button type="button" data-view="account">Account</button>
                    <div class="portal-nav-footer">
                        <a class="portal-website" href="index.html">Website</a>
                        <button type="button" id="portal-sign-out" class="portal-sign-out">Sign Out</button>
                    </div>

                <div class="portal-main">
                    <p id="portal-alert" class="portal-alert" role="alert" hidden></p>
                    <div id="portal-view" tabindex="-1"></div>
