<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Pulse Analytics Client Portal</title>
    <meta name="description" content="Reset your Pulse Analytics Client Portal password.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="assetts/images/Pulse%20Analytics%20Favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="client-portal.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-brand">
                <div class="header-logo">
                    <a href="index.html" class="logo">
                        <img src="assetts/images/transparent-logo-PA.jpeg" alt="Pulse Analytics Group LLC Logo">
                    </a>
                </div>
                <div class="header-branding">
                    <h1>Pulse Analytics Group LLC</h1>
                    <p>Client Portal</p>
                </div>
            </div>
            <div class="header-nav">
                <nav aria-label="Client auth navigation">
                    <ul class="nav-links">
                        <li><a href="client-login.html">Back to Sign In</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main class="client-auth-page">
        <div class="container">
            <div class="client-auth-card">
                <div class="client-auth-brand">
                    <img src="assetts/images/transparent-logo-PA.jpeg" alt="">
                    <h1>Forgot Password</h1>
                    <p>We will email password reset instructions if an account exists.</p>
                </div>

                <div id="auth-alert" class="client-auth-alert" role="alert" aria-live="polite"></div>

                <form id="forgot-form" class="client-auth-form" novalidate>
                    <label>
                        Email
                        <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@company.com">
                    </label>
                    <div class="client-auth-actions">
                        <button type="submit" class="primary-button" id="reset-btn">Send Reset Link</button>
                    </div>
                </form>

                <div class="client-auth-links">
                    <a href="client-login.html">Return to Sign In</a>
                    <a href="index.html">Website home</a>
                </div>
            </div>
        </div>
    </main>

    <script src="js/supabase-env.js"></script>
    <script type="module">
        import { initAuth, resetPassword } from './js/pulse-auth.js';

        const alertEl = document.getElementById('auth-alert');
        const form = document.getElementById('forgot-form');
        const button = document.getElementById('reset-btn');

        const genericSuccess =
            'If an account exists for that email, a password reset link has been sent. Check your inbox and spam folder.';

        function showAlert(message, type = 'info') {
            alertEl.textContent = message;
            alertEl.dataset.type = type;
            alertEl.classList.add('is-visible');
        }

        try {
            await initAuth();
        } catch (err) {
            showAlert(err.message || 'Unable to initialize authentication.', 'error');
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const email = form.email.value.trim();
            if (!email) {
                showAlert('Enter your email address.', 'error');
                return;
            }

            button.disabled = true;
            button.textContent = 'Sending…';

            try {
                await resetPassword(email);
                showAlert(genericSuccess, 'success');
                form.reset();
            } catch (_) {
                // Same message whether or not the account exists (avoid enumeration).
                showAlert(genericSuccess, 'success');
            } finally {
                button.disabled = false;
                button.textContent = 'Send Reset Link';
            }
        });
    </script>
</body>
</html>
