# Cloudflare Workers Static Assets - Pulse Analytics Group LLC
# Deploy: npm run build && npx wrangler deploy
#
# This file is the Worker configuration source of truth for the default
# production Worker (name = pulse-analytics-website). There is no named
# Wrangler environment. Plain variables that exist only in the dashboard are
# removed on deploy. Secrets are not removed and are never stored here.
#
# SUPABASE_URL is a non-secret variable.
# OPENALEX_API_KEY, SUPABASE_ANON_KEY, CENSUS_API_KEY, and STRIPE_SECRET_KEY are required Cloudflare secrets.
# STRIPE_PUBLISHABLE_KEY is also a required Cloudflare secret so it survives deploy.
# It is a publishable key and is returned to the browser for Stripe.js. Do not put STRIPE_SECRET_KEY in [vars].
# Set or update secret values with `npx wrangler secret put <NAME>`.
# Do not commit secret values.
#
# Preserves the existing GitHub -> Cloudflare static-asset deployment flow.
# A thin Worker runs first for legacy-domain / legacy-path redirects and the research catalog API.

name = "pulse-analytics-website"
compatibility_date = "2026-03-20"
main = "workers/router.js"

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = true

[vars]
SUPABASE_URL = "https://gultqhsccxuqvibymwdg.supabase.co"

[secrets]
required = ["OPENALEX_API_KEY", "SUPABASE_ANON_KEY", "CENSUS_API_KEY", "STRIPE_SECRET_KEY", "STRIPE_PUBLISHABLE_KEY"]
